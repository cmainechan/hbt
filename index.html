<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interlinear Practice</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e3b45f'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%231a1408' font-family='serif'%3E%D7%90%3C/text%3E%3C/svg%3E">
<style>
  /* Latin fonts self-hosted from the hub (cmainechan.github.io/heb), so this
     tool's chrome matches the rest of the site. The Hebrew font is also
     cross-referenced from there (Frank Ruhl Libre, which renders niqqud and
     cantillation cleanly) -- unlike the word-builder tool, which deliberately
     keeps plain consonant tiles in Times New Roman, this app's whole point is
     reading fully-pointed verses, so the dedicated Hebrew font earns its keep
     here. */
  @font-face{font-family:"Fraunces";font-style:normal;font-weight:400 700;font-display:swap;src:url("https://cmainechan.github.io/heb/fonts/fraunces-latin-wght-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url("https://cmainechan.github.io/heb/fonts/figtree-latin-wght-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Frank Ruhl Libre";font-style:normal;font-weight:300 900;font-display:swap;src:url("https://cmainechan.github.io/heb/fonts/frank-ruhl-libre-hebrew-wght-normal.woff2") format("woff2");unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}

  :root {
    color-scheme: dark light;
    --bg: #141311;
    --card: #1e1c19;
    --line: #34312b;
    --tx: #efe9dc;
    --mu: #a09a8c;
    --ac: #e3b45f;
    --on: #1a1408;
    --good: #5fb37f;
    --good-bg: rgba(47, 122, 79, 0.22);
    --bad: #e2726a;
    --bad-bg: rgba(179, 38, 30, 0.2);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --he: "Frank Ruhl Libre", "SBL Hebrew", "Ezra SIL", "Noto Serif Hebrew", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f2e8;
      --card: #fffdf8;
      --line: #ddd4c2;
      --tx: #24211b;
      --mu: #6f6858;
      --ac: #86590a;
      --on: #fffdf8;
      --good: #2f7a4f;
      --good-bg: #e6f4ea;
      --bad: #b3261e;
      --bad-bg: #fbe9e7;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 2.5rem;
    background: var(--bg);
    color: var(--tx);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- Site brand (links back to the hub) ---------- */
  .site-brand {
    max-width: 880px;
    margin: 0 auto 1.2rem;
    text-align: left;
  }
  .brand-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .brand-link .mark {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--ac);
    color: var(--on);
    font-family: var(--he);
    font-size: 17px;
    line-height: 1;
  }
  .brand-link .name {
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--mu);
    transition: color 0.2s ease;
  }
  .brand-link:hover .name { color: var(--ac); }
  .brand-link:focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; border-radius: 6px; }

  .shell {
    max-width: 880px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    padding: 2rem 2rem 2.5rem;
  }

  .fish-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 10px; }
  .fish-link {
    display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.75rem;
    border-radius: 999px; background: var(--ac); color: var(--on); font-weight: 600;
    font-size: 0.9rem; text-decoration: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .fish-link:hover { opacity: 0.85; }
  .fish-link:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .fish-link.bump { transform: scale(1.18); }
  .fish-link .to-inn { font-weight: 400; opacity: 0.8; font-size: 0.8rem; }

  .page-header { text-align: center; margin-bottom: 0.5rem; }
  h1 {
    font-family: var(--serif); font-weight: 500; font-size: 1.7rem;
    margin: 0; letter-spacing: -0.01em;
  }
  .page-header .subtitle {
    color: var(--mu); font-size: 0.95rem; margin: 10px auto 0; max-width: 560px;
  }
  .page-header .rule {
    width: 60px; height: 3px; background: var(--ac); border-radius: 2px; margin: 0.9rem auto 1.4rem;
  }
  .ref { color: var(--ac); font-weight: bold; margin-bottom: 14px; text-align: center; min-height: 1.2em; }

  .lookup-row {
    display: flex; gap: 8px; margin: 0 auto 6px; width: 100%; max-width: 460px; justify-content: center;
  }
  .lookup-row input {
    flex: 1; font-family: inherit; font-size: 0.9rem; padding: 8px 12px;
    border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--tx);
  }
  .lookup-row input:focus { outline: none; border-color: var(--ac); }
  .lookup-row button {
    font-family: inherit; font-size: 0.85rem; padding: 8px 16px; border-radius: 10px;
    border: none; background: var(--ac); color: var(--on); cursor: pointer; white-space: nowrap;
    transition: opacity 0.2s ease;
  }
  .lookup-row button:hover:not(:disabled) { opacity: 0.9; }
  .lookup-row button:disabled { opacity: 0.6; cursor: default; }
  .star-btn {
    flex: 0 0 auto; background: transparent !important; color: var(--mu) !important;
    border: 1.5px solid var(--line) !important; font-size: 1rem; padding: 8px 12px !important;
    line-height: 1;
  }
  .star-btn:hover { border-color: var(--ac) !important; color: var(--ac) !important; opacity: 1 !important; }
  .star-btn.active { color: var(--ac) !important; border-color: var(--ac) !important; }
  .lookup-msg {
    font-size: 0.78rem; color: var(--bad); margin-bottom: 6px; min-height: 14px; text-align: center; max-width: 500px; margin-left: auto; margin-right: auto;
  }
  .range-hint {
    font-size: 0.72rem; color: var(--mu); margin: 0 auto 8px; text-align: center; max-width: 500px;
  }
  .favorites-dropdown { position: relative; }
  .favorites-toggle {
    font-family: inherit; font-size: 0.85rem; padding: 0.25rem 0.75rem; border-radius: 999px;
    border: 1.5px solid var(--line); background: transparent; color: var(--mu); cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .favorites-toggle:hover { border-color: var(--ac); color: var(--ac); }
  .favorites-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; transform: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); padding: 8px; min-width: 240px; max-width: 320px;
    max-height: 260px; overflow-y: auto; z-index: 20; text-align: left;
  }
  .favorites-panel.open { display: block; }
  .favorites-empty { font-size: 0.78rem; color: var(--mu); padding: 8px; text-align: center; }
  .favorite-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    border-radius: 6px; padding: 2px;
  }
  .favorite-item:hover { background: var(--bg); }
  .favorite-open {
    flex: 1; text-align: left; background: none; border: none; color: var(--tx);
    font-family: inherit; font-size: 0.82rem; padding: 6px 8px; cursor: pointer; border-radius: 6px;
  }
  .favorite-remove {
    background: none; border: none; color: var(--mu); font-size: 0.8rem; cursor: pointer;
    padding: 4px 8px; border-radius: 6px; line-height: 1;
  }
  .favorite-remove:hover { color: var(--bad); }
  .settings-row {
    display: flex; gap: 20px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .toggle-switch {
    display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.8rem; color: var(--mu);
  }
  .toggle-switch input { display: none; }
  .toggle-switch .slider {
    width: 32px; height: 18px; border-radius: 999px; background: var(--line);
    position: relative; transition: background 0.15s ease; flex-shrink: 0;
  }
  .toggle-switch .slider::before {
    content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: var(--card); top: 2px; left: 2px; transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle-switch input:checked + .slider { background: var(--ac); }
  .toggle-switch input:checked + .slider::before { transform: translateX(14px); }
  .board.hide-translit .translit-line { display: none; }
  .board.hide-morph .grammar-line { display: none; }
  .board {
    position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 22px; width: 100%; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .verse-block { margin-bottom: 22px; }
  .verse-num-label {
    direction: rtl; text-align: right; font-size: 0.75rem; color: var(--ac);
    margin-bottom: 4px; font-weight: bold;
  }
  .verse-line {
    direction: rtl; display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: flex-start;
  }
  .word-unit { display: flex; flex-direction: column; align-items: center; min-width: 92px; }
  .top-row {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 4px; gap: 1px;
  }
  .word-unit input {
    width: 100%; text-align: center; direction: ltr; font-family: var(--sans); font-size: 0.85rem;
    padding: 5px 4px; border: 1.5px solid var(--line); border-radius: 6px; margin-top: 6px;
    background: var(--card); color: var(--tx);
  }
  .word-unit input:focus { outline: none; border-color: var(--ac); }
  .word-unit input.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: bold; }
  .word-unit input.incorrect { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .hebrew-word { font-family: var(--he); font-size: 1.7rem; line-height: 1.6; white-space: nowrap; }
  .translit-line {
    font-family: var(--sans); font-size: 0.65rem; font-style: italic; color: var(--mu); white-space: nowrap;
  }
  .strongs-line {
    font-family: var(--sans); font-size: 0.62rem; white-space: nowrap;
  }
  .strongs-line a {
    color: var(--ac); text-decoration: none; border-bottom: 1px dotted var(--ac);
  }
  .strongs-line a:hover { border-bottom-style: solid; }
  .lexicon-tooltip {
    position: absolute; z-index: 1000; background: #2b2620; color: #fbf7ef;
    padding: 8px 12px; border-radius: 8px; font-family: var(--sans);
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    pointer-events: none; max-width: 220px;
  }
  .lexicon-tooltip-hebrew { font-family: var(--he); font-size: 1.3rem; line-height: 1.3; }
  .lexicon-tooltip-translit { font-size: 0.72rem; font-style: italic; color: #d8cdb8; margin-top: 2px; }
  .lexicon-tooltip-gloss { font-size: 0.78rem; margin-top: 4px; color: #fbf7ef; }
  .reveal { font-family: var(--sans); font-size: 0.72rem; color: var(--ac); margin-top: 3px; min-height: 12px; text-align: center; max-width: 100px; }
  .grammar-line {
    font-family: var(--sans); font-size: 0.68rem; text-transform: lowercase; letter-spacing: 0.02em;
    color: var(--mu); margin-top: 4px; text-align: center; max-width: 120px;
    line-height: 1.3; min-height: 18px;
  }
  .controls { display: flex; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .controls button {
    font-family: inherit; font-size: 0.85rem; padding: 8px 18px; border-radius: 10px;
    border: none; cursor: pointer; background: var(--ac); color: var(--on);
    transition: opacity 0.2s ease;
  }
  .controls button:hover { opacity: 0.9; }
  .controls button.secondary {
    background: transparent; color: var(--mu); border: 1.5px solid var(--line);
  }
  .controls button.secondary:hover { border-color: var(--ac); color: var(--ac); opacity: 1; }
  .score { text-align: center; margin-top: 14px; font-size: 0.9rem; color: var(--mu); }
  .fish-pop {
    position: fixed; transform: translateX(-50%);
    background: var(--ac); color: var(--on); font-weight: 700; padding: 0.3rem 0.8rem;
    border-radius: 999px; pointer-events: none; white-space: nowrap; z-index: 5;
    animation: fishpop 1.4s ease-out forwards;
  }
  @keyframes fishpop {
    0% { opacity: 0; transform: translate(-50%, 8px) scale(0.8); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    70% { opacity: 1; transform: translate(-50%, -18px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -30px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fish-pop { animation-duration: 1.6s; animation-name: fishfade; }
    @keyframes fishfade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
    .fish-link { transition: none; }
  }
  .loading { text-align: center; color: var(--mu); font-size: 0.9rem; padding: 20px; }

  /* ---------- Site footer (links back to the hub) ---------- */
  .site-foot {
    max-width: 880px;
    margin: 1.6rem auto 0;
    padding-top: 1.1rem;
    border-top: 1px solid var(--line);
    color: var(--mu);
    font-size: 0.85rem;
  }
  .site-foot p { margin: 0 0 0.3rem; }
  .site-foot a { color: var(--ac); text-decoration: none; }
  .site-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header class="site-brand">
  <a href="https://cmainechan.github.io/heb/" class="brand-link">
    <span class="mark" aria-hidden="true" lang="he">א</span>
    <span class="name">Biblical Hebrew Practice</span>
  </a>
</header>

<div class="shell">

  <div class="fish-bar">
    <div class="favorites-dropdown">
      <button id="favoritesToggleBtn" class="favorites-toggle" title="View your favorite passages" aria-label="View your favorite passages">★ <span id="favoritesCount">0</span></button>
      <div class="favorites-panel" id="favoritesPanel"></div>
    </div>
    <a href="../inn/" class="fish-link" id="fish-link" title="Spend your fish in the inn">
      <span id="fish-count">🐟 0</span><span class="to-inn">Inn</span>
    </a>
  </div>

  <header class="page-header">
    <h1>Interlinear Practice</h1>
    <p class="subtitle">Type the English gloss for each Hebrew word, then press <b>Enter</b>.</p>
    <div class="rule"></div>
  </header>

  <div class="ref" id="refLabel">Type a citation to begin</div>

  <div class="lookup-row">
    <input type="text" id="citationInput" placeholder="e.g. Genesis 1:1 or Genesis 1:1-5" autocomplete="off">
    <button id="lookupBtn">Load</button>
    <button id="favoriteBtn" class="star-btn" title="Save this passage to your favorites" aria-label="Save this passage to your favorites">☆</button>
  </div>
  <div class="lookup-msg" id="lookupMsg"></div>
  <div class="range-hint">Single verses or short ranges within one chapter, e.g. "Psalm 23:1-6".</div>

  <div class="settings-row">
    <label class="toggle-switch">
      <input type="checkbox" id="translitToggle" checked>
      <span class="slider"></span>
      <span class="toggle-label">Transliteration</span>
    </label>
    <label class="toggle-switch">
      <input type="checkbox" id="morphToggle" checked>
      <span class="slider"></span>
      <span class="toggle-label">Morphology</span>
    </label>
  </div>

  <div class="board" id="board" style="display:none;">
    <div id="verseContainer"></div>
    <div class="controls">
      <button class="secondary" id="prevBtn">◀ Previous verse</button>
      <button id="checkAllBtn">Check remaining</button>
      <button class="secondary" id="resetBtn">Reset</button>
      <button class="secondary" id="nextBtn">Next verse ▶</button>
    </div>
    <div class="score" id="scoreLine"></div>
  </div>

</div>

<footer class="site-foot">
  <p><a href="https://cmainechan.github.io/heb/">&larr; All tools</a></p>
</footer>

<script>
// ---------------------------------------------------------------------
// Data: fetched on demand from ./data/<book>.json (one file per book,
// generated from STEPBible TAHOT — Tyndale House, CC BY 4.0).
// Structure per book file: { "<chapter>": { "<verse>": [ {hebrew, answers[]}, ... ] } }
// ---------------------------------------------------------------------

const BOOK_ALIASES = {
  "genesis":"genesis","gen":"genesis","gn":"genesis",
  "exodus":"exodus","exo":"exodus","ex":"exodus",
  "leviticus":"leviticus","lev":"leviticus","lv":"leviticus",
  "numbers":"numbers","num":"numbers","nu":"numbers","nm":"numbers",
  "deuteronomy":"deuteronomy","deut":"deuteronomy","deu":"deuteronomy","dt":"deuteronomy",
  "joshua":"joshua","josh":"joshua","jos":"joshua",
  "judges":"judges","judg":"judges","jdg":"judges",
  "ruth":"ruth","rut":"ruth","ru":"ruth",
  "1samuel":"1samuel","1sam":"1samuel","1sa":"1samuel","isamuel":"1samuel",
  "2samuel":"2samuel","2sam":"2samuel","2sa":"2samuel","iisamuel":"2samuel",
  "1kings":"1kings","1kg":"1kings","1ki":"1kings","ikings":"1kings",
  "2kings":"2kings","2kg":"2kings","2ki":"2kings","iikings":"2kings",
  "1chronicles":"1chronicles","1chron":"1chronicles","1ch":"1chronicles","ichronicles":"1chronicles",
  "2chronicles":"2chronicles","2chron":"2chronicles","2ch":"2chronicles","iichronicles":"2chronicles",
  "ezra":"ezra","ezr":"ezra",
  "nehemiah":"nehemiah","neh":"nehemiah",
  "esther":"esther","est":"esther",
  "job":"job",
  "psalm":"psalm","psalms":"psalm","ps":"psalm","psa":"psalm",
  "proverbs":"proverbs","prov":"proverbs","pro":"proverbs","pr":"proverbs",
  "ecclesiastes":"ecclesiastes","eccl":"ecclesiastes","ecc":"ecclesiastes","qoheleth":"ecclesiastes",
  "songofsongs":"songofsongs","song":"songofsongs","sng":"songofsongs","canticles":"songofsongs","songofsolomon":"songofsongs",
  "isaiah":"isaiah","isa":"isaiah",
  "jeremiah":"jeremiah","jer":"jeremiah",
  "lamentations":"lamentations","lam":"lamentations",
  "ezekiel":"ezekiel","ezek":"ezekiel","ezk":"ezekiel",
  "daniel":"daniel","dan":"daniel",
  "hosea":"hosea","hos":"hosea",
  "joel":"joel","jol":"joel",
  "amos":"amos","amo":"amos",
  "obadiah":"obadiah","oba":"obadiah","obad":"obadiah",
  "jonah":"jonah","jon":"jonah",
  "micah":"micah","mic":"micah",
  "nahum":"nahum","nah":"nahum","nam":"nahum",
  "habakkuk":"habakkuk","hab":"habakkuk",
  "zephaniah":"zephaniah","zeph":"zephaniah","zep":"zephaniah",
  "haggai":"haggai","hag":"haggai",
  "zechariah":"zechariah","zech":"zechariah","zec":"zechariah",
  "malachi":"malachi","mal":"malachi"
};

const BOOK_ORDER = [
  "genesis","exodus","leviticus","numbers","deuteronomy",
  "joshua","judges","ruth","1samuel","2samuel","1kings","2kings",
  "1chronicles","2chronicles","ezra","nehemiah","esther","job",
  "psalm","proverbs","ecclesiastes","songofsongs","isaiah","jeremiah",
  "lamentations","ezekiel","daniel","hosea","joel","amos","obadiah",
  "jonah","micah","nahum","habakkuk","zephaniah","haggai","zechariah","malachi"
];

// Display names for the internal book keys (used for the reference label,
// favorites, and messages). Keys like "1samuel" can't be capitalised
// mechanically, so each one is spelled out.
const BOOK_NAMES = {
  genesis:"Genesis", exodus:"Exodus", leviticus:"Leviticus", numbers:"Numbers",
  deuteronomy:"Deuteronomy", joshua:"Joshua", judges:"Judges", ruth:"Ruth",
  "1samuel":"1 Samuel", "2samuel":"2 Samuel", "1kings":"1 Kings", "2kings":"2 Kings",
  "1chronicles":"1 Chronicles", "2chronicles":"2 Chronicles", ezra:"Ezra",
  nehemiah:"Nehemiah", esther:"Esther", job:"Job", psalm:"Psalm",
  proverbs:"Proverbs", ecclesiastes:"Ecclesiastes", songofsongs:"Song of Songs",
  isaiah:"Isaiah", jeremiah:"Jeremiah", lamentations:"Lamentations",
  ezekiel:"Ezekiel", daniel:"Daniel", hosea:"Hosea", joel:"Joel", amos:"Amos",
  obadiah:"Obadiah", jonah:"Jonah", micah:"Micah", nahum:"Nahum",
  habakkuk:"Habakkuk", zephaniah:"Zephaniah", haggai:"Haggai",
  zechariah:"Zechariah", malachi:"Malachi"
};
const bookName = key => BOOK_NAMES[key] || key;

// "Genesis 1:1" or "Genesis 1:1-5"
function formatCitation(bookKey, chapter, startVerse, endVerse) {
  const range = endVerse && endVerse !== startVerse ? `-${endVerse}` : '';
  return `${bookName(bookKey)} ${chapter}:${startVerse}${range}`;
}

const bookCache = {}; // book_key -> parsed JSON (cached after first fetch)
let currentVerses = []; // array of {ref, words, bookKey, chapter, verseNum, isTitle}

const refLabel = document.getElementById('refLabel');
const lookupMsg = document.getElementById('lookupMsg');
const board = document.getElementById('board');
const verseContainer = document.getElementById('verseContainer');
const scoreLine = document.getElementById('scoreLine');
const lookupBtn = document.getElementById('lookupBtn');

function normalize(str) {
  let s = str.toLowerCase().trim().replace(/[.,;:!?'"()]/g, '').replace(/\s+/g, ' ');
  // article flexibility: "the heavens" and "heavens" are treated as equivalent
  s = s.replace(/^(the|a|an)\s+/, '');
  return s;
}

// ---------- Fish ----------
// Shared wallet with the inn (cmainechan.github.io/inn/). Every page on the
// site reads and writes the same "fish" key in localStorage.
// Fish are paid out when the reader presses "Next verse", and only for verses
// where every word is correct at that moment (answers can be freely corrected
// beforehand). The payout scales with how much help is on screen:
//   transliteration + morphology both shown -> 2 fish per verse
//   either one hidden                       -> 4 fish per verse
//   both hidden                             -> 8 fish per verse
// Each verse pays out once per page visit, so Reset can't be farmed.
const FISH_KEY = 'fish';
const FISH_BASE_PER_VERSE = 2;
const awardedVerses = new Set();

// A verse pays at the lowest multiplier of any toggle state it was worked in:
// if transliteration or morphology was shown at any point while the current
// passage was on screen, it counts as shown. Reset on every (re)render.
let translitEverShown = true;
let morphEverShown = true;

function resetAidTracking() {
  translitEverShown = document.getElementById('translitToggle').checked;
  morphEverShown = document.getElementById('morphToggle').checked;
}

function fishPerVerse() {
  const hidden = (translitEverShown ? 0 : 1) + (morphEverShown ? 0 : 1);
  return FISH_BASE_PER_VERSE * Math.pow(2, hidden); // 2, 4, 4, 8
}

// ---------- Daily progress ----------
// Shared with the heb landing page dashboard (cmainechan.github.io/heb/).
// Aggregate-only, reset whenever the stored date isn't today.
const DAILY_KEY = 'heb:daily';
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function bumpDaily(widget) {
  let data;
  try { data = JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch (e) { data = {}; }
  const today = todayStr();
  if (data.date !== today) data = { date: today };
  data[widget] = (data[widget] || 0) + 1;
  try { localStorage.setItem(DAILY_KEY, JSON.stringify(data)); } catch (e) {}
}

function getFish() {
  let n = 0;
  try { n = parseInt(localStorage.getItem(FISH_KEY) || '0', 10); } catch (e) {}
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function renderFish(bump) {
  const link = document.getElementById('fish-link');
  document.getElementById('fish-count').textContent = `🐟 ${getFish()}`;
  if (bump) {
    link.classList.add('bump');
    setTimeout(() => link.classList.remove('bump'), 220);
  }
}

function addFish(amount) {
  try { localStorage.setItem(FISH_KEY, String(getFish() + amount)); } catch (e) {}
  renderFish(true);
  const pop = document.createElement('div');
  pop.className = 'fish-pop';
  pop.textContent = `+${amount} 🐟`;
  // Pop up on the buttons' line, centred on the button row, clamped on screen.
  const row = document.querySelector('.controls').getBoundingClientRect();
  const btn = document.getElementById('nextBtn').getBoundingClientRect();
  const x = Math.max(50, Math.min(row.left + row.width / 2, window.innerWidth - 50));
  const y = Math.max(40, Math.min(btn.top + btn.height / 2, window.innerHeight - 40));
  pop.style.left = `${x}px`;
  pop.style.top = `${y - 16}px`;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1500);
}

window.addEventListener('storage', e => { if (e.key === FISH_KEY) renderFish(true); });
renderFish();

// Words STEPBible marks as untranslated (e.g. the object marker et) list "-"
// or "(untranslated)" among their answers; leaving those blank is correct.
function canBeBlank(wordData) {
  return wordData.answers.some(a => a === '-' || a === '(untranslated)');
}

// Grades whatever is currently typed in the field (no need to have pressed
// Enter on it first), using the same rules as checkWord().
function isWordCorrect(input, wordData) {
  const userAns = normalize(input.value);
  return (userAns === '' && canBeBlank(wordData)) ||
    wordData.answers.some(a => normalize(a) === userAns);
}

// Called when the reader presses "Next verse". Every verse on screen that
// hasn't been paid yet is graded on its current answers; a verse earns fish
// only if all of its words are correct. Returns the total fish awarded.
function awardFishOnSubmit() {
  const perVerse = fishPerVerse();
  let fish = 0;
  currentVerses.forEach((verse, vIdx) => {
    if (awardedVerses.has(verse.ref)) return;
    const inputs = Array.from(verseContainer.querySelectorAll(`input[data-v-idx="${vIdx}"]`));
    if (inputs.length === 0) return;
    const perfect = inputs.every(inp =>
      isWordCorrect(inp, verse.words[parseInt(inp.dataset.wIdx, 10)]));
    if (perfect) {
      awardedVerses.add(verse.ref);
      fish += perVerse;
      bumpDaily('hbt');
    }
  });
  if (fish > 0) addFish(fish);
  return fish;
}

// Remembers the passage on screen so the next visit resumes there.
const LAST_CITATION_KEY = 'lastCitation';
function saveLastCitation(verses) {
  if (verses.length === 0) return;
  const first = verses[0];
  const last = verses[verses.length - 1];
  try { localStorage.setItem(LAST_CITATION_KEY, formatCitation(first.bookKey, first.chapter, first.verseNum, last.verseNum)); } catch (e) {}
}

// ---------- Favorites ----------
// Lets the reader bookmark a passage and return to it later. Stored as a
// list of { key, label } in localStorage: `key` (parsed book/chapter/verse)
// is used to dedupe and to match the star's on/off state; `label` is the
// citation text re-fed into lookupVerse when the favorite is opened.
const FAVORITES_KEY = 'favorites';
const favoriteBtn = document.getElementById('favoriteBtn');
const favoritesToggleBtn = document.getElementById('favoritesToggleBtn');
const favoritesPanel = document.getElementById('favoritesPanel');

function getFavorites() {
  try {
    const list = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function saveFavorites(list) {
  try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); } catch (e) {}
}

function favoriteKeyFor(parsed) {
  return `${parsed.bookKey}|${parsed.chapter}|${parsed.startVerse}|${parsed.endVerse}`;
}

function toggleFavorite() {
  const input = document.getElementById('citationInput');
  const parsed = parseCitation(input.value);
  if (!parsed) return;
  const key = favoriteKeyFor(parsed);
  const list = getFavorites();
  const idx = list.findIndex(f => f.key === key);
  if (idx >= 0) {
    list.splice(idx, 1);
  } else {
    list.push({ key, label: formatCitation(parsed.bookKey, parsed.chapter, parsed.startVerse, parsed.endVerse) });
  }
  saveFavorites(list);
  renderFavoriteBtn();
  renderFavoritesPanel();
}

function renderFavoriteBtn() {
  const parsed = parseCitation(document.getElementById('citationInput').value);
  const active = !!parsed && getFavorites().some(f => f.key === favoriteKeyFor(parsed));
  favoriteBtn.textContent = active ? '★' : '☆';
  favoriteBtn.title = active ? 'Remove this passage from your favorites' : 'Save this passage to your favorites';
  favoriteBtn.classList.toggle('active', active);
}

function renderFavoritesPanel() {
  const list = getFavorites();
  document.getElementById('favoritesCount').textContent = list.length;
  favoritesPanel.innerHTML = '';
  if (list.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'favorites-empty';
    empty.textContent = 'No favorites yet — tap ☆ next to Load to save a passage.';
    favoritesPanel.appendChild(empty);
    return;
  }
  list.forEach(fav => {
    const row = document.createElement('div');
    row.className = 'favorite-item';

    const openBtn = document.createElement('button');
    openBtn.className = 'favorite-open';
    // Re-derive the label so favourites saved earlier in lowercase
    // (e.g. "genesis 1:1") also display with a capitalised book name.
    const favParsed = parseCitation(fav.label);
    const favLabel = favParsed
      ? formatCitation(favParsed.bookKey, favParsed.chapter, favParsed.startVerse, favParsed.endVerse)
      : fav.label;
    openBtn.textContent = favLabel;
    openBtn.addEventListener('click', () => {
      document.getElementById('citationInput').value = favLabel;
      lookupVerse(favLabel);
      favoritesPanel.classList.remove('open');
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'favorite-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove this favorite';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      saveFavorites(getFavorites().filter(f => f.key !== fav.key));
      renderFavoritesPanel();
      renderFavoriteBtn();
    });

    row.appendChild(openBtn);
    row.appendChild(removeBtn);
    favoritesPanel.appendChild(row);
  });
}

favoriteBtn.addEventListener('click', toggleFavorite);
favoritesToggleBtn.addEventListener('click', () => {
  favoritesPanel.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.favorites-dropdown')) favoritesPanel.classList.remove('open');
});
renderFavoritesPanel();

// Parses "Genesis 1:1", "gen 1:1-5", "1 Samuel 2:3" etc.
function parseCitation(raw) {
  const cleaned = raw.trim().toLowerCase();
  const m = cleaned.match(/^([1-3]?\s?[a-z]+)\s*(\d+)\s*:\s*(\d+)(?:\s*-\s*(\d+))?$/);
  if (!m) return null;
  const bookRaw = m[1].replace(/\s+/g, '');
  const bookKey = BOOK_ALIASES[bookRaw];
  if (!bookKey) return null;
  const chapter = parseInt(m[2], 10);
  const startVerse = parseInt(m[3], 10);
  const endVerse = m[4] ? parseInt(m[4], 10) : startVerse;
  return { bookKey, chapter, startVerse, endVerse };
}

async function loadBook(bookKey) {
  if (bookCache[bookKey]) return bookCache[bookKey];
  const res = await fetch(`./data/${bookKey}.json`);
  if (!res.ok) throw new Error(`Could not load data for "${bookKey}"`);
  const json = await res.json();
  bookCache[bookKey] = json;
  return json;
}

async function lookupVerse(raw) {
  lookupMsg.textContent = '';
  const parsed = parseCitation(raw);
  if (!parsed) {
    lookupMsg.textContent = 'Couldn\'t read that citation. Try "Genesis 1:1" or "Genesis 1:1-5".';
    return;
  }
  const { bookKey, chapter, startVerse, endVerse } = parsed;
  if (endVerse < startVerse || endVerse - startVerse > 30) {
    lookupMsg.textContent = 'Please request a range of 30 verses or fewer.';
    return;
  }

  lookupBtn.disabled = true;
  lookupBtn.textContent = 'Loading…';
  try {
    const bookData = await loadBook(bookKey);
    const chapData = bookData[String(chapter)];
    if (!chapData) {
      lookupMsg.textContent = `That chapter wasn't found in ${bookName(bookKey)}.`;
      return;
    }
    const bookLabel = raw.trim().split(/\s+\d/)[0]; // preserve user's book capitalization roughly
    const verses = [];
    if (startVerse === 1 && chapData['0']) {
      verses.push({ ref: `${bookKey} ${chapter} (title)`, words: chapData['0'], isTitle: true, bookKey, chapter, verseNum: 0 });
    }
    for (let v = startVerse; v <= endVerse; v++) {
      const words = chapData[String(v)];
      if (words) {
        verses.push({ ref: `${bookKey} ${chapter}:${v}`, words, bookKey, chapter, verseNum: v });
      }
    }
    if (verses.length === 0) {
      lookupMsg.textContent = 'No verses found in that range.';
      return;
    }
    currentVerses = verses;
    renderAll();
  } catch (err) {
    lookupMsg.textContent = 'Error loading that book\'s data: ' + err.message;
  } finally {
    lookupBtn.disabled = false;
    lookupBtn.textContent = 'Load';
  }
}

function renderAll() {
  resetAidTracking();
  board.style.display = 'block';
  verseContainer.innerHTML = '';
  const nonTitleVerses = currentVerses.filter(v => !v.isTitle);
  const firstV = nonTitleVerses[0];
  const lastV = nonTitleVerses[nonTitleVerses.length - 1];
  const firstLabel = formatCitation(firstV.bookKey, firstV.chapter, firstV.verseNum);
  refLabel.textContent = nonTitleVerses.length > 1 ? `${firstLabel} – ${lastV.verseNum}` : firstLabel;
  // Keep the search box in sync with what's on screen, with the book name
  // capitalised (also tidies abbreviations like "gen 1:1" -> "Genesis 1:1").
  document.getElementById('citationInput').value =
    formatCitation(firstV.bookKey, firstV.chapter, firstV.verseNum, lastV.verseNum);
  saveLastCitation(nonTitleVerses);
  renderFavoriteBtn();

  currentVerses.forEach((verse, vIdx) => {
    const block = document.createElement('div');
    block.className = 'verse-block';

    if (currentVerses.length > 1 && !verse.isTitle) {
      const label = document.createElement('div');
      label.className = 'verse-num-label';
      label.textContent = formatCitation(verse.bookKey, verse.chapter, verse.verseNum);
      block.appendChild(label);
    } else if (verse.isTitle) {
      const label = document.createElement('div');
      label.className = 'verse-num-label';
      label.style.fontStyle = 'italic';
      label.textContent = 'Title';
      block.appendChild(label);
    }

    const line = document.createElement('div');
    line.className = 'verse-line';

    verse.words.forEach((w, wIdx) => {
      const unit = document.createElement('div');
      unit.className = 'word-unit';

      const topRow = document.createElement('div');
      topRow.className = 'top-row';

      const strongsDiv = document.createElement('div');
      strongsDiv.className = 'strongs-line';
      if (w.strongs && w.strongs.length) {
        w.strongs.forEach((code, i) => {
          if (i > 0) strongsDiv.appendChild(document.createTextNode(', '));
          const a = document.createElement('a');
          a.href = strongsToUrl(code);
          a.textContent = code;
          a.target = '_blank';
          a.rel = 'noopener';
          a.className = 'strongs-link';
          a.dataset.strongsCode = code;
          wireLexiconTooltip(a, code);
          strongsDiv.appendChild(a);
        });
      }

      const translitDiv = document.createElement('div');
      translitDiv.className = 'translit-line';
      translitDiv.textContent = w.translit || '';

      topRow.appendChild(strongsDiv);
      topRow.appendChild(translitDiv);

      const hebrewDiv = document.createElement('div');
      hebrewDiv.className = 'hebrew-word';
      hebrewDiv.textContent = w.hebrew;

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '…';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.dataset.vIdx = vIdx;
      input.dataset.wIdx = wIdx;

      const revealDiv = document.createElement('div');
      revealDiv.className = 'reveal';

      const grammarDiv = document.createElement('div');
      grammarDiv.className = 'grammar-line';
      grammarDiv.textContent = w.grammar || '';

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          checkWord(input, revealDiv, w);
          focusNext(input);
        }
      });

      unit.appendChild(topRow);
      unit.appendChild(hebrewDiv);
      unit.appendChild(input);
      unit.appendChild(revealDiv);
      unit.appendChild(grammarDiv);
      line.appendChild(unit);
    });

    block.appendChild(line);
    verseContainer.appendChild(block);
  });

  updateScore();
  const firstInput = verseContainer.querySelector('input');
  if (firstInput) firstInput.focus();
}

function strongsToUrl(code) {
  // code like 'H7225' -> https://biblehub.com/hebrew/7225.htm
  const num = parseInt(code.slice(1), 10);
  return `https://biblehub.com/hebrew/${num}.htm`;
}

// ---------------------------------------------------------------------
// Lexicon tooltip: shows the dictionary lemma + gloss for a Strong's
// number on hover (desktop) or tap (touch), sourced from STEPBible's
// TBESH lexicon (CC BY). Loaded once and cached.
// ---------------------------------------------------------------------
let lexiconData = null;
let lexiconLoadPromise = null;

function loadLexicon() {
  if (lexiconLoadPromise) return lexiconLoadPromise;
  lexiconLoadPromise = fetch('./lexicon.json')
    .then(res => res.ok ? res.json() : {})
    .then(json => { lexiconData = json; return json; })
    .catch(() => { lexiconData = {}; return {}; });
  return lexiconLoadPromise;
}

const tooltipEl = document.createElement('div');
tooltipEl.className = 'lexicon-tooltip';
tooltipEl.style.display = 'none';
document.body.appendChild(tooltipEl);

function showTooltip(anchorEl, code) {
  const entry = lexiconData && lexiconData[code];
  if (!entry) return;
  tooltipEl.innerHTML = `
    <div class="lexicon-tooltip-hebrew">${entry.hebrew}</div>
    <div class="lexicon-tooltip-translit">${entry.translit}</div>
    <div class="lexicon-tooltip-gloss">"${entry.gloss}"</div>
  `;
  tooltipEl.style.display = 'block';
  const rect = anchorEl.getBoundingClientRect();
  const tipRect = tooltipEl.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - tipRect.width / 2 + window.scrollX;
  left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8 + window.scrollX));
  const top = rect.top - tipRect.height - 8 + window.scrollY;
  tooltipEl.style.left = `${left}px`;
  tooltipEl.style.top = `${top}px`;
}

function hideTooltip() {
  tooltipEl.style.display = 'none';
}

function wireLexiconTooltip(anchorEl, code) {
  // Desktop: hover
  anchorEl.addEventListener('mouseenter', () => {
    loadLexicon().then(() => showTooltip(anchorEl, code));
  });
  anchorEl.addEventListener('mouseleave', hideTooltip);

  // Touch: tap toggles the tooltip instead of navigating immediately,
  // so a first tap previews the lexicon entry rather than leaving the page
  anchorEl.addEventListener('click', (e) => {
    if (tooltipEl.style.display === 'block' && tooltipEl.dataset.forCode === code) {
      // second tap on the same link while its tooltip is open: let the
      // link navigate normally
      tooltipEl.dataset.forCode = '';
      return;
    }
    if (window.matchMedia('(hover: none)').matches) {
      e.preventDefault();
      loadLexicon().then(() => {
        showTooltip(anchorEl, code);
        tooltipEl.dataset.forCode = code;
      });
    }
  });
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.strongs-link')) hideTooltip();
});

function checkWord(input, revealDiv, wordData) {
  const isCorrect = isWordCorrect(input, wordData);
  input.classList.remove('correct', 'incorrect');
  if (isCorrect) {
    input.classList.add('correct');
    revealDiv.textContent = '✓';
    revealDiv.style.color = 'var(--good)';
  } else {
    input.classList.add('incorrect');
    revealDiv.textContent = wordData.answers[0];
    revealDiv.style.color = 'var(--bad)';
  }
  input.dataset.checked = 'true';
  input.dataset.correct = isCorrect ? 'true' : 'false';
  updateScore();
}

function focusNext(currentInput) {
  const inputs = Array.from(verseContainer.querySelectorAll('input'));
  const idx = inputs.indexOf(currentInput);
  const next = inputs[idx + 1];
  if (next) next.focus();
}

function updateScore() {
  const inputs = Array.from(verseContainer.querySelectorAll('input'));
  const checked = inputs.filter(i => i.dataset.checked === 'true');
  const right = checked.filter(i => i.dataset.correct === 'true');
  const total = inputs.length;
  scoreLine.textContent = `${right.length} / ${total} correct so far (${checked.length} checked) · worth ${fishPerVerse()} 🐟 per verse`;
}

document.getElementById('checkAllBtn').addEventListener('click', () => {
  const units = verseContainer.querySelectorAll('.word-unit');
  units.forEach((unit) => {
    const input = unit.querySelector('input');
    if (input.dataset.checked !== 'true') {
      const revealDiv = unit.querySelector('.reveal');
      const vIdx = parseInt(input.dataset.vIdx, 10);
      const wIdx = parseInt(input.dataset.wIdx, 10);
      const wordData = currentVerses[vIdx].words[wIdx];
      checkWord(input, revealDiv, wordData);
    }
  });
});

function maxChapter(bookData) {
  return Math.max(...Object.keys(bookData).map(Number));
}

function maxVerse(bookData, chapter) {
  const chapData = bookData[String(chapter)];
  if (!chapData) return 0;
  const nums = Object.keys(chapData).map(Number).filter(n => n > 0);
  return nums.length ? Math.max(...nums) : 0;
}

async function showSingleVerse(bookKey, chapter, verseNum) {
  const bookData = await loadBook(bookKey);
  const chapData = bookData[String(chapter)];
  if (!chapData || !chapData[String(verseNum)]) {
    lookupMsg.textContent = `Couldn't find ${formatCitation(bookKey, chapter, verseNum)}.`;
    return;
  }
  const verses = [];
  if (verseNum === 1 && chapData['0']) {
    verses.push({ ref: `${bookKey} ${chapter} (title)`, words: chapData['0'], isTitle: true, bookKey, chapter, verseNum: 0 });
  }
  verses.push({ ref: `${bookKey} ${chapter}:${verseNum}`, words: chapData[String(verseNum)], bookKey, chapter, verseNum });
  currentVerses = verses;
  lookupMsg.textContent = '';
  document.getElementById('citationInput').value = formatCitation(bookKey, chapter, verseNum);
  renderAll();
}

async function goToAdjacentVerse(direction) {
  if (currentVerses.length === 0) return;
  const nonTitle = currentVerses.filter(v => !v.isTitle);
  const anchor = direction === 1 ? nonTitle[nonTitle.length - 1] : nonTitle[0];
  let { bookKey, chapter, verseNum } = anchor;
  let bookData = await loadBook(bookKey);

  verseNum += direction;

  if (direction === 1) {
    // moving forward: does verseNum still exist in this chapter?
    if (!bookData[String(chapter)] || !bookData[String(chapter)][String(verseNum)]) {
      chapter += 1;
      if (!bookData[String(chapter)]) {
        const nextIdx = BOOK_ORDER.indexOf(bookKey) + 1;
        if (nextIdx >= BOOK_ORDER.length) {
          lookupMsg.textContent = "You've reached the end of the Tanakh (Malachi).";
          return;
        }
        bookKey = BOOK_ORDER[nextIdx];
        bookData = await loadBook(bookKey);
        chapter = 1;
      }
      verseNum = 1;
    }
  } else {
    // moving backward
    if (verseNum < 1) {
      chapter -= 1;
      if (chapter < 1) {
        const prevIdx = BOOK_ORDER.indexOf(bookKey) - 1;
        if (prevIdx < 0) {
          lookupMsg.textContent = "You're at the start of the Tanakh (Genesis 1:1).";
          return;
        }
        bookKey = BOOK_ORDER[prevIdx];
        bookData = await loadBook(bookKey);
        chapter = maxChapter(bookData);
      }
      verseNum = maxVerse(bookData, chapter);
    }
  }

  await showSingleVerse(bookKey, chapter, verseNum);
}

document.getElementById('nextBtn').addEventListener('click', async () => {
  // Grade first (the verse on screen is about to be replaced), then move on.
  awardFishOnSubmit();
  await goToAdjacentVerse(1);
});
document.getElementById('prevBtn').addEventListener('click', () => goToAdjacentVerse(-1));

document.getElementById('resetBtn').addEventListener('click', renderAll);

lookupBtn.addEventListener('click', () => {
  lookupVerse(document.getElementById('citationInput').value);
});
document.getElementById('citationInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    lookupVerse(e.target.value);
  }
});

document.getElementById('translitToggle').addEventListener('change', (e) => {
  board.classList.toggle('hide-translit', !e.target.checked);
  if (e.target.checked) translitEverShown = true;
  updateScore();
});
document.getElementById('morphToggle').addEventListener('change', (e) => {
  board.classList.toggle('hide-morph', !e.target.checked);
  if (e.target.checked) morphEverShown = true;
  updateScore();
});

// Resume where the reader left off, or start at Genesis 1:1-5
const DEFAULT_CITATION = 'Genesis 1:1-5';
let startCitation = DEFAULT_CITATION;
try {
  const saved = localStorage.getItem(LAST_CITATION_KEY);
  if (saved && parseCitation(saved)) startCitation = saved;
} catch (e) {}
// Normalise (a citation saved by an older version may be lowercase)
const startParsed = parseCitation(startCitation);
if (startParsed) {
  startCitation = formatCitation(startParsed.bookKey, startParsed.chapter, startParsed.startVerse, startParsed.endVerse);
}
lookupVerse(startCitation);
document.getElementById('citationInput').value = startCitation;
</script>
